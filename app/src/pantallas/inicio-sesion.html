<!DOCTYPE html>
<html lang="es" data-pantalla="inicio-sesion">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect y=%2711%27 width=%2732%27 height=%277%27 rx=%273%27 fill=%27%230066FF%27/%3E%3Crect y=%2721%27 width=%2724%27 height=%277%27 rx=%273%27 fill=%27%231C1E4D%27/%3E%3C/svg%3E">
  <title>Inicia sesión · Simple.sv</title>
  <link rel="stylesheet" href="../vendor/fuentes/fuentes.css">
  <link rel="stylesheet" href="../vendor/phosphor/regular/style.css">
  <link rel="stylesheet" href="../src/styles/simple-light-vibrant.css">
  <link rel="stylesheet" href="pantallas.css">
</head>
<body>
  <!-- En la app reemplaza a nuevoDiseño/login.html (copia de la pantalla oficial): el ingreso se hace con el
       proveedor de Identidad Digital en el navegador del sistema, nunca con un formulario dentro de la app -->
  <main class="app-pantalla">
    <header class="app-encabezado">
      <img src="logo.svg" alt="Simple.sv" width="120" height="27">
      <a class="app-volver" href="../index.html"><i class="ph ph-house" aria-hidden="true"></i>Inicio</a>
    </header>
    <section class="app-tarjeta" aria-labelledby="titulo">
      <span class="app-icono-grande" aria-hidden="true"><i class="ph ph-identification-card"></i></span>
      <h1 id="titulo">Inicia sesión</h1>
      <p>Entra con tu Identidad Digital del Gobierno de El Salvador. Simple.sv no ve ni guarda tu contraseña.</p>
      <div class="app-acciones">
        <button class="app-boton app-boton-principal" type="button" id="ingresar-identidad"><i class="ph ph-sign-in" aria-hidden="true"></i>Ingresar con Identidad Digital</button>
        <button class="app-boton app-boton-secundario" type="button" id="ingresar-biometria" hidden><i class="ph ph-fingerprint" aria-hidden="true"></i>Ingresar con huella o rostro</button>
      </div>
      <p class="app-mensaje" id="mensaje" role="status" aria-live="polite"></p>
    </section>
    <p class="app-nota"><i class="ph ph-info" aria-hidden="true"></i><span>¿Aún no tienes Identidad Digital? <a class="app-enlace" id="crear-identidad" href="https://login.gob.sv/">Créala en login.gob.sv</a></span></p>
    <p class="app-pie" id="pie"></p>
  </main>
</body>
</html>
