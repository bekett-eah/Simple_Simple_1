<!DOCTYPE html>
<html lang="es" data-pantalla="biometria">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect y=%2711%27 width=%2732%27 height=%277%27 rx=%273%27 fill=%27%230066FF%27/%3E%3Crect y=%2721%27 width=%2724%27 height=%277%27 rx=%273%27 fill=%27%231C1E4D%27/%3E%3C/svg%3E">
  <title>Ingreso con biometría · Simple.sv</title>
  <link rel="stylesheet" href="../vendor/fuentes/fuentes.css">
  <link rel="stylesheet" href="../vendor/phosphor/regular/style.css">
  <link rel="stylesheet" href="../src/styles/simple-light-vibrant.css">
  <link rel="stylesheet" href="pantallas.css">
</head>
<body>
  <main class="app-pantalla">
    <header class="app-encabezado">
      <img src="logo.svg" alt="Simple.sv" width="120" height="27">
    </header>
    <section class="app-tarjeta" aria-labelledby="titulo">
      <span class="app-icono-grande" aria-hidden="true"><i class="ph ph-fingerprint"></i></span>
      <h1 id="titulo">¿Entrar más rápido la próxima vez?</h1>
      <p>Activa tu huella o tu rostro para volver a entrar sin escribir tus datos. Es opcional y puedes desactivarlo cuando quieras en Mi cuenta.</p>
      <p class="app-nota"><i class="ph ph-shield-check" aria-hidden="true"></i><span>Tu huella o tu rostro no salen del teléfono: los revisa el sistema del teléfono y Simple.sv nunca los recibe.</span></p>
      <div class="app-acciones">
        <button class="app-boton app-boton-principal" type="button" id="activar"><i class="ph ph-fingerprint" aria-hidden="true"></i>Activar huella o rostro</button>
        <button class="app-boton app-boton-secundario" type="button" id="omitir">Ahora no</button>
      </div>
      <p class="app-mensaje" id="mensaje" role="status" aria-live="polite"></p>
    </section>
  </main>
</body>
</html>
